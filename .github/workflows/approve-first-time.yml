name: approve-first-time

# GitHub holds workflow runs from first-time contributors at
# conclusion=action_required until a maintainer approves them. A contributor
# who sees no checks assumes the repo is dead, so approve those automatically,
# but never for a PR that edits CI itself.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  pull-requests: read

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to approve PRs that touch CI configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename')
          if echo "$files" | grep -Eq '^(\.github/|scripts/verify\.sh)'; then
            echo "PR touches CI configuration; leaving approval to a human"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
        id: guard
      - name: Approve pending runs for this PR
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.event.pull_request.head.sha }}"
          ids=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$sha" --jq '.workflow_runs[] | select(.conclusion=="action_required") | .id')
          for id in $ids; do echo "approving run $id"; gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/approve"; done

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentracker-ai"
version = "0.2.1"
description = "See where your agent sessions spend tokens: per session, per file, per skill."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "mgkvibez"}]
keywords = ["tokens", "llm", "agents", "observability", "cost"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.0"]

[project.scripts]
tokentracker = "tokentracker.cli:main"

[tool.setuptools.packages.find]
include = ["tokentracker*"]
